name: Backup restore tests

on:
  push:
    branches:
      - feature/struktura-crm-1.13.5-safe-restore
  pull_request:
    paths:
      - 'src/backup-restore.cjs'
      - 'tests/backup-restore.test.cjs'
      - '.github/workflows/backup-restore-tests.yml'

jobs:
  backup-restore-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated restore tests
        run: node --test tests/backup-restore.test.cjs
